<?xml version="1.0" encoding="UTF-8"?>
<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Warm parchment with subtle texture -->
  <rect width="192" height="192" rx="48" fill="#F8F1E7"/>
  
  <!-- Shadow/depth layer -->
  <rect x="8" y="8" width="176" height="176" rx="40" fill="url(#shadowGradient)" opacity="0.15"/>
  
  <!-- Main parchment background with golden shadow -->
  <rect x="16" y="16" width="160" height="160" rx="32" fill="url(#parchmentGradient)" stroke="url(#goldenBorderGradient)" stroke-width="3"/>
  
  <!-- Manuscript page effect with golden shadow -->
  <rect x="28" y="28" width="136" height="136" rx="20" fill="#FFFBF4" stroke="url(#goldenAccentGradient)" stroke-width="2" opacity="0.95"/>
  
  <!-- Decorative manuscript border with enhanced golden shadow -->
  <rect x="36" y="36" width="120" height="120" rx="12" fill="none" stroke="url(#goldenBorderGradient)" stroke-width="2" opacity="0.8"/>
  
  <!-- Central quill feather - staying close to original with subtle improvements -->
  <g transform="translate(96, 96)">
    <!-- Quill shaft -->
    <line x1="-12" y1="36" x2="12" y2="-36" stroke="#4B3621" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Feather vanes - slightly larger and more elegant -->
    <path d="M12 -36 C18 -30, 22 -20, 24 -4 C22 2, 16 8, 12 12 C6 18, 0 24, -6 30 C-12 36, -16 40, -12 36" 
          fill="url(#featherGradient)" stroke="#4B3621" stroke-width="2" opacity="0.9"/>
    
    <!-- Enhanced feather details with golden hints -->
    <path d="M12 -32 C14 -26, 16 -16, 18 0" stroke="#C6A664" stroke-width="1.2" opacity="0.8"/>
    <path d="M12 -28 C14 -22, 15 -12, 16 4" stroke="#C6A664" stroke-width="1" opacity="0.7"/>
    <path d="M12 -24 C13 -18, 14 -8, 14 8" stroke="#72634F" stroke-width="0.8" opacity="0.6"/>
    
    <!-- Subtle golden highlights on the shaft -->
    <line x1="-8" y1="32" x2="8" y2="-32" stroke="#C6A664" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Larger ink dot at quill tip -->
  <circle cx="108" cy="60" r="3.5" fill="#1E1B18" opacity="0.8"/>
  
  <!-- Enhanced decorative manuscript illumination corners with golden glow -->
  <g opacity="0.6">
    <!-- Top left with glow -->
    <circle cx="48" cy="48" r="4" fill="url(#goldenGlowGradient)"/>
    <circle cx="48" cy="48" r="2.5" fill="#C6A664"/>
    <circle cx="48" cy="48" r="1.2" fill="#F8F1E7"/>
    
    <!-- Top right with glow -->
    <circle cx="144" cy="48" r="4" fill="url(#goldenGlowGradient)"/>
    <circle cx="144" cy="48" r="2.5" fill="#C6A664"/>
    <circle cx="144" cy="48" r="1.2" fill="#F8F1E7"/>
    
    <!-- Bottom left with glow -->
    <circle cx="48" cy="144" r="4" fill="url(#goldenGlowGradient)"/>
    <circle cx="48" cy="144" r="2.5" fill="#C6A664"/>
    <circle cx="48" cy="144" r="1.2" fill="#F8F1E7"/>
    
    <!-- Bottom right with glow -->
    <circle cx="144" cy="144" r="4" fill="url(#goldenGlowGradient)"/>
    <circle cx="144" cy="144" r="2.5" fill="#C6A664"/>
    <circle cx="144" cy="144" r="1.2" fill="#F8F1E7"/>
  </g>
  
  <!-- Subtle text lines to suggest document scanning -->
  <g opacity="0.25" stroke="#4B3621" stroke-width="1.2">
    <line x1="52" y1="120" x2="88" y2="120"/>
    <line x1="52" y1="128" x2="108" y2="128"/>
    <line x1="52" y1="136" x2="76" y2="136"/>
  </g>
  
  <!-- Enhanced gradients -->
  <defs>
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1B18;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#1E1B18;stop-opacity:0.3"/>
    </linearGradient>
    
    <linearGradient id="parchmentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF4EA"/>
      <stop offset="50%" style="stop-color:#F8F1E7"/>
      <stop offset="100%" style="stop-color:#F3E9DD"/>
    </linearGradient>
    
    <linearGradient id="goldenBorderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6D196"/>
      <stop offset="30%" style="stop-color:#C6A664"/>
      <stop offset="70%" style="stop-color:#B8984E"/>
      <stop offset="100%" style="stop-color:#9E8A48"/>
    </linearGradient>
    
    <linearGradient id="goldenAccentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D6BC7E"/>
      <stop offset="50%" style="stop-color:#C6A664"/>
      <stop offset="100%" style="stop-color:#B8984E"/>
    </linearGradient>
    
    <radialGradient id="goldenGlowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E6D196;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#C6A664;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#C6A664;stop-opacity:0.2"/>
    </radialGradient>
    
    <linearGradient id="penBarrelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B5D4F"/>
      <stop offset="30%" style="stop-color:#4B3621"/>
      <stop offset="70%" style="stop-color:#3C2A19"/>
      <stop offset="100%" style="stop-color:#2A1F15"/>
    </linearGradient>
    
    <linearGradient id="featherGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C6A664"/>
      <stop offset="30%" style="stop-color:#D6BC7E"/>
      <stop offset="70%" style="stop-color:#C6A664"/>
      <stop offset="100%" style="stop-color:#9E8A48"/>
    </linearGradient>
  </defs>
</svg>